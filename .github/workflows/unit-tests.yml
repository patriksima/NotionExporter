name: Run Unit Tests

on:
    push:
        branches:
            - main
            - master
    pull_request:
        branches:
            - main
            - master

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4

            -   name: Setup .NET
                uses: actions/setup-dotnet@v4
                with:
                    dotnet-version: '9.0.x'

            -   name: Restore dependencies
                run: dotnet restore

            -   name: Build solution
                run: dotnet build --no-restore --configuration Release

            -   name: Run tests
                run: dotnet test NotionExporter.Tests/NotionExporter.Tests.csproj --no-build --configuration Release --logger trx --verbosity normal

            -   name: Upload test results
                uses: actions/upload-artifact@v4
                with:
                    name: test-results
                    path: '**/*.trx'